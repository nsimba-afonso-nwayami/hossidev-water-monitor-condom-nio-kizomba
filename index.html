    <script>
      // Suppress Vite HMR / WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message).toLowerCase() : '';
        var src = (event && event.filename) ? String(event.filename) : '';
        if (msg.indexOf('websocket') !== -1 || msg.indexOf('runner') !== -1 || src.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) ? String(event.reason) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
